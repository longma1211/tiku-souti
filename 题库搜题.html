<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>题库搜题</title>

<style>:root {
  --bg: #0d1014;
  --panel: #151a21;
  --panel-2: #1b222c;
  --line: #262f3b;
  --text: #e6edf5;
  --muted: #8b98a8;
  --accent: #4f8cff;
  --accent-2: #22d3ee;
  --ok: #34d399;
  --warn: #fbbf24;
  --err: #f87171;
  --radius: 12px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", system-ui, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(79, 140, 255, .12), transparent 60%),
    radial-gradient(900px 500px at 5% 0%, rgba(34, 211, 238, .08), transparent 55%),
    var(--bg);
}

/* ---------- 顶栏 ---------- */
header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(13, 16, 20, .82);
}

.logo {
  width: 30px; height: 30px;
  border-radius: 9px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  font-size: 15px; font-weight: 700; color: #06121f;
}

h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }

.spacer { flex: 1; }

.pill {
  font-size: 12px;
  color: var(--muted);
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.pill b { color: var(--accent-2); font-weight: 600; }

/* ---------- 布局 ---------- */
main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr);
  gap: 18px;
  padding: 18px 22px 26px;
  align-items: start;
}
@media (max-width: 980px) { main { grid-template-columns: 1fr; } }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
  color: #cdd8e6;
}
.card-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.card-body { padding: 16px; }

/* ---------- 标签页 ---------- */
.tabs { display: flex; gap: 6px; padding: 12px 16px 0; }
.tab {
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  padding: 7px 14px;
  border-radius: 9px 9px 0 0;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
}
.tab:hover { color: var(--text); background: var(--panel-2); }
.tab.active { color: var(--text); background: var(--panel-2); border-color: var(--line); border-bottom-color: var(--panel-2); }

.pane { display: none; padding: 16px; }
.pane.active { display: block; }

/* ---------- 按钮 ---------- */
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  padding: 9px 16px;
  border-radius: 9px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: .15s;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.btn:hover:not(:disabled) { border-color: #3a4756; background: #232c38; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(135deg, var(--accent), #3b76e8);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(79, 140, 255, .28);
}
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn-row { display: flex; flex-wrap: wrap; gap: 9px; }

/* ---------- 预览区 ---------- */
.stage {
  position: relative;
  border: 1px dashed var(--line);
  border-radius: 10px;
  background: #0a0d11;
  min-height: 240px;
  display: grid;
  place-items: center;
  overflow: hidden;
  margin-top: 14px;
}
.stage video, .stage canvas, .stage img { max-width: 100%; max-height: 380px; display: block; }
.stage .hint {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 30px 20px;
  line-height: 2;
}
.stage .hint kbd {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 6px;
  font-size: 12px;
  color: var(--text);
}
#selectCanvas { cursor: crosshair; }

.sel-rect {
  position: absolute;
  border: 1.5px solid var(--accent);
  background: rgba(79, 140, 255, .14);
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45);
  pointer-events: none;
  display: none;
}

/* ---------- 文本域 ---------- */
textarea, input[type=text], input[type=password] {
  width: 100%;
  background: #0a0d11;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 10px 12px;
  font: 13px/1.7 ui-monospace, Consolas, "Microsoft YaHei UI", monospace;
  resize: vertical;
  outline: none;
}
textarea:focus, input:focus { border-color: var(--accent); }
label.field { display: block; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
label.field span { display: block; margin-bottom: 5px; }

/* ---------- 结果 ---------- */
.answer-box {
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(52, 211, 153, .10), rgba(52, 211, 153, .02));
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.answer-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.answer-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--ok);
  letter-spacing: .5px;
  word-break: break-word;
}
.answer-value.none { font-size: 15px; color: var(--warn); font-weight: 500; }

.meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip {
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: var(--panel-2);
}
.chip.tag { color: var(--accent-2); border-color: rgba(34, 211, 238, .28); }
.chip.good { color: var(--ok); border-color: rgba(52, 211, 153, .3); }
.chip.warn { color: var(--warn); border-color: rgba(251, 191, 36, .3); }

.section-title { font-size: 12px; color: var(--muted); margin: 0 0 6px; letter-spacing: .5px; }
.analysis { white-space: pre-wrap; color: #cdd8e6; font-size: 13.5px; line-height: 1.85; }

.question-text {
  color: #dbe4ef;
  font-size: 13.5px;
  white-space: pre-wrap;
  padding: 10px 12px;
  border-left: 2px solid var(--accent);
  background: rgba(79, 140, 255, .06);
  border-radius: 0 8px 8px 0;
  margin-bottom: 14px;
}

.options { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
.options li {
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 13px;
  color: #c3cfdd;
  background: var(--panel-2);
}
.options li.correct { border-color: rgba(52, 211, 153, .5); background: rgba(52, 211, 153, .10); color: #a7f3d0; }

.candidates { display: grid; gap: 7px; }
.cand {
  display: flex; gap: 10px; align-items: center;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  cursor: pointer;
  font-size: 12.5px;
  color: #c3cfdd;
  transition: .12s;
}
.cand:hover { border-color: var(--accent); }
.cand .sc { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.cand .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 26px 12px; line-height: 2; }

/* ---------- 进度 ---------- */
.progress {
  height: 3px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 12px;
  display: none;
}
.progress.on { display: block; }
.progress > i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .25s;
}
.status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 18px; }
.status.err { color: var(--err); }
.status.ok { color: var(--ok); }

/* ---------- 设置抽屉 ---------- */
.drawer {
  position: fixed;
  inset: 0 0 0 auto;
  width: min(420px, 92vw);
  background: var(--panel);
  border-left: 1px solid var(--line);
  transform: translateX(105%);
  transition: transform .22s ease;
  z-index: 40;
  display: flex;
  flex-direction: column;
  box-shadow: -20px 0 60px rgba(0, 0, 0, .5);
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer-body { padding: 18px; overflow: auto; }
.mask {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .5);
  opacity: 0; pointer-events: none; transition: .2s; z-index: 30;
}
.mask.on { opacity: 1; pointer-events: auto; }
.note { font-size: 12px; color: var(--muted); line-height: 1.8; }
code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

.answer-value.long {
  font-size: 14.5px;
  font-weight: 500;
  color: #d6f5e7;
  line-height: 1.85;
  letter-spacing: 0;
}

/* ---------- 语音输入 ---------- */
.voice-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 14px 0 6px;
}

.mic {
  position: relative;
  width: 78px; height: 78px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--accent);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: .18s;
}
.mic:hover:not(:disabled) { border-color: var(--accent); background: #232c38; }
.mic:disabled { opacity: .4; cursor: not-allowed; }
.mic.on {
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 0 0 0 rgba(239, 68, 68, .55);
  animation: micPulse 1.6s infinite;
}
@keyframes micPulse {
  0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, .55); }
  70%  { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}

.voice-tip { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.9; }

.voice-live {
  margin-top: 14px;
  min-height: 96px;
  max-height: 220px;
  overflow: auto;
  background: #0a0d11;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14.5px;
  line-height: 1.9;
  color: #dbe4ef;
  white-space: pre-wrap;
  word-break: break-word;
}
.voice-live .ph { color: #56606e; }
.voice-live .interim { color: var(--muted); }
.voice-live .listening { color: var(--accent-2); font-size: 12px; }

.voice-note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.8; }
.voice-note.err { color: var(--err); }

/* ---------- 麦克风自检 ---------- */
.meter {
  height: 10px;
  margin-top: 12px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.meter > i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--ok), var(--warn));
  transition: width .08s linear;
}

pre.diag {
  margin-top: 12px;
  padding: 12px 14px;
  background: #0a0d11;
  border: 1px solid var(--line);
  border-radius: 10px;
  font: 12px/1.9 ui-monospace, Consolas, "Microsoft YaHei UI", monospace;
  color: #c3cfdd;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 260px;
  overflow: auto;
}

/* 单列布局（只保留文字输入时） */
main.single {
  grid-template-columns: minmax(0, 1fr);
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}
main.single .card + .card { margin-top: 4px; }
</style>
<style>
/* 手机端适配 */
body { -webkit-text-size-adjust: 100%; }
header { padding: calc(10px + env(safe-area-inset-top)) 14px 10px; }
main.single {
  padding: 12px 12px calc(28px + env(safe-area-inset-bottom));
  gap: 12px;
}
h1 { font-size: 14px; }
h1 small { display: none; }
textarea { font-size: 16px !important; line-height: 1.8; }  /* 16px 防止安卓/iOS 自动缩放 */
.btn { min-height: 44px; padding: 11px 18px; font-size: 15px; }
.btn-row { gap: 10px; }
.btn-row .btn { flex: 1; justify-content: center; }
.answer-value { font-size: 26px; }
.answer-value.long { font-size: 15px; }
.options li { padding: 10px 12px; font-size: 14px; }
.cand { padding: 11px 12px; font-size: 13px; }
.card-body { padding: 14px; }
.pane { padding: 14px; }
.chip { font-size: 11.5px; }
</style>
</head>
<body>

<header>
  <div class="logo">搜</div>
  <h1>题库搜题<small>离线版</small></h1>
  <div class="spacer"></div>
  <span class="pill" id="bankCount">题库加载中…</span>
</header>

<main class="single">
  <section class="card">
    <div class="card-head"><span class="dot"></span>输入题目</div>
    <div class="pane active" style="display:block">
      <label class="field">
        <span>粘贴或输入题干（停顿 0.6 秒自动查询）</span>
        <textarea id="q" rows="6" placeholder="例：汽轮机禁止启动项有哪些"></textarea>
      </label>
      <div class="btn-row">
        <button class="btn primary" id="go">立即查询</button>
        <button class="btn ghost" id="clear">清空</button>
      </div>
      <div class="status" id="status" style="margin-top:10px"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><span class="dot" style="background:var(--ok)"></span>结果</div>
    <div class="card-body" id="result">
      <div class="empty">还没有结果<br><span style="font-size:12px">在上面输入题目，答案会出现在这里</span></div>
    </div>
  </section>

ns":[],"answer":"①汇报值长火情，报火警，启动电动消防泵； ②泡沫泵房就地打开泡沫混合器进、出口门，检查#1油罐泡沫及消防冷却水雨淋阀已启动，否则手动紧急启动； ③根据#1油罐火情外溢情况，就地开启#1油罐就近泡沫消防栓。","analysis":"","tags":["简答"]},{"id":"jd-009","question":"3、锅炉容量：","options":[],"answer":"即锅炉的蒸发量，是指锅炉每小时所产生的蒸汽量。","analysis":"","tags":["简答"]},{"id":"jd-010","question":"4、再热器：","options":[],"answer":"将汽轮机高压缸排汽加热成具有一定温度的再热蒸汽的热交换器。","analysis":"","tags":["简答"]},{"id":"jd-011","question":"5、压力：","options":[],"answer":"单位面积上所受到的垂直作用力。","analysis":"","tags":["简答"]},{"id":"jd-012","question":"6、辐射：","options":[],"answer":"物体通过电磁波来传递能量的方式。","analysis":"","tags":["简答"]},{"id":"jd-013","question":"7、流体：","options":[],"answer":"容易变形具有流动性的物质。","analysis":"","tags":["简答"]},{"id":"jd-014","question":"1、沸腾：","options":[],"answer":"液体表面和液体内部同时进行的剧烈的汽化现象。","analysis":"","tags":["简答"]},{"id":"jd-015","question":"2、省煤器：","options":[],"answer":"利用锅炉尾部烟气的热量加热锅炉给水的热交换器。","analysis":"","tags":["简答"]},{"id":"jd-016","question":"3、工质：","options":[],"answer":"实现热能和机械能相互转化的媒介物质。","analysis":"","tags":["简答"]},{"id":"jd-017","question":"4、导热：","options":[],"answer":"物体各部分之间不发生相对位移，依靠分子、原子及自由电子等微观粒子的热运动而产生的热量传递。","analysis":"","tags":["简答"]},{"id":"jd-018","question":"5、温度：","options":[],"answer":"标志物体冷热的程度。","analysis":"","tags":["简答"]},{"id":"jd-019","question":"6、不同转速的转机振动合格标准是什么？","options":[],"answer":"(1) 额定转速750r/min以下的转机，轴承振动值不超过0.12mm；(2) 额定转速1000r/min的转机，轴承振动值不超过0.10mm；(3) 额定转速1500r/min的转机，轴承振动值不超过0.085mm；(4) 额定转速3000r/min的转机，轴承振动值不超过0.05mm。","analysis":"","tags":["简答"]},{"id":"jd-020","question":"7、简述润滑油（脂）的作用。","options":[],"answer":"润滑油（脂）可以减少转动机械与轴瓦（轴承）动静之间摩擦，降低摩擦阻力，保护轴和轴承不发生擦伤及破裂，以达到延长轴和轴承的使用寿命。","analysis":"","tags":["简答"]},{"id":"jd-021","question":"8、水的汽化方式有哪几种？","options":[],"answer":"(1)蒸发：是在水的表面进行的较为缓慢的汽化过程。可以在任意温度下进行。(2)沸腾：是在液体表面和内部同时进行的较为强烈的汽化现象。只有在液体温度达到其对应压力下的饱和温度时才会发生。例如一个大气压力下，水温达到：1 0 0 ^{\\circ} C时开始沸腾。","analysis":"","tags":["简答"]},{"id":"jd-022","question":"干渣机冷却风机联锁停止条件？","options":[],"answer":"两台送风机停止运行","analysis":"","tags":["简答"]},{"id":"jd-023","question":"干渣机冷却风机运行中如果低负荷时排烟温度低于130℃时如何处理？","options":[],"answer":"首先采取投运暖风器提高排烟温度，其次停运干渣机冷却风机。当负荷增加时及时投运干渣机冷却风机。","analysis":"","tags":["简答"]},{"id":"jd-024","question":"发生下列情况之一时，紧急停运干渣机冷却风机：","options":[],"answer":"1、设备发生剧烈振动 2、清楚地听到设备内部右明显金属摩擦声 3、电机或电缆线冒烟着火 4、轴承冒烟着火或轴承温度超过95℃ 5、设备运行威胁人身或设备安全时 6、电机线圈温度超过120℃ 7、水冷壁或高温过热器爆管时","analysis":"","tags":["简答"]}];</script>
<script>/* 题库搜题 · 手机离线版
   题库通过 window.__BANK__ 注入，匹配逻辑与电脑端 server.mjs 保持一致 */
'use strict';

/* ------------------------------------------------------------------ *
 * 匹配（与 server.mjs 的 search 同一套算法）
 * ------------------------------------------------------------------ */

const norm = (s) => {
  if (!s) return '';
  let t = String(s).normalize('NFKC').toLowerCase();
  t = t.replace(/^\s*第?\s*\d{1,3}\s*[、.．)）:：]\s*/, '');
  return t.replace(/[^\u4e00-\u9fa5\u3040-\u30ffa-z0-9]+/g, '');
};

const grams = (s, n) => {
  const out = new Set();
  if (!s) return out;
  if (s.length < n) { out.add(s); return out; }
  for (let i = 0; i + n <= s.length; i++) out.add(s.slice(i, i + n));
  return out;
};

const dice = (a, b) => {
  if (!a.size || !b.size) return 0;
  const [small, big] = a.size <= b.size ? [a, b] : [b, a];
  let hit = 0;
  for (const g of small) if (big.has(g)) hit++;
  return (2 * hit) / (a.size + b.size);
};

const BANK = Array.isArray(window.__BANK__) ? window.__BANK__ : [];

const INDEX = BANK.map((item) => {
  const qNorm = norm(item.question);
  const optTexts = (item.options || [])
    .map((o) => norm(String(o).replace(/^[A-Ha-h][.、．)）:：]\s*/, '')))
    .filter((t) => t.length >= 1);
  const fullNorm = norm([item.question, ...(item.options || [])].join(''));
  return { id: item.id, qNorm, fullNorm, optTexts, q2: grams(qNorm, 2), q3: grams(qNorm, 3), f2: grams(fullNorm, 2) };
});

const round = (n) => Math.round(n * 1000) / 1000;

function search(text, limit = 5) {
  const q = norm(text);
  if (q.length < 2) return { best: null, candidates: [], partial: false };
  const tooShort = q.length < 5;
  const q2 = grams(q, 2);
  const q3 = grams(q, 3);

  const scored = [];
  for (let i = 0; i < BANK.length; i++) {
    const ix = INDEX[i];
    if (!ix.qNorm) continue;
    let score;

    if (!tooShort && (q.includes(ix.qNorm) || ix.qNorm.includes(q))) score = 0.97;
    else if (!tooShort && (q.includes(ix.fullNorm) || ix.fullNorm.includes(q))) score = 0.9;
    else {
      const d2 = dice(q2, ix.q2);
      const d3 = dice(q3, ix.q3);
      const df = dice(q2, ix.f2);
      let optHit = 0;
      for (const o of ix.optTexts) if (o.length >= 2 && q.includes(o)) optHit++;
      const optRate = ix.optTexts.length ? optHit / ix.optTexts.length : 0;
      score = 0.4 * d2 + 0.32 * d3 + 0.13 * df + 0.15 * optRate;

      // 只说半句时按覆盖率兜底，封顶 0.8
      if (q.length >= 8 && q.length < ix.qNorm.length * 0.8) {
        let hit = 0;
        for (const g of q2) if (ix.q2.has(g)) hit++;
        const cov = hit / q2.size;
        if (cov >= 0.62) score = Math.max(score, Math.min(0.8, cov * 0.78));
      }
    }
    scored.push({ item: BANK[i], score });
  }

  scored.sort((a, b) => b.score - a.score);
  const candidates = scored.slice(0, limit).map(({ item, score }) => ({ ...item, score: round(score) }));
  const best = !tooShort && candidates[0] && candidates[0].score >= 0.34 ? candidates[0] : null;
  return { best, candidates, partial: tooShort };
}

/* ------------------------------------------------------------------ *
 * 渲染
 * ------------------------------------------------------------------ */

const $ = (s) => document.querySelector(s);
const el = { text: $('#q'), status: $('#status'), result: $('#result') };

const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function setStatus(msg, kind = '') {
  el.status.textContent = msg || '';
  el.status.className = 'status' + (kind ? ' ' + kind : '');
}

function scoreChip(score) {
  const p = Math.round(score * 100);
  const cls = score >= 0.8 ? 'good' : score >= 0.5 ? 'warn' : '';
  return `<span class="chip ${cls}">相似度 ${p}%</span>`;
}

function renderCandidates(list) {
  if (!list || !list.length) return '';
  return `
    <div class="section-title" style="margin-top:20px">其他候选（点一下查看该题）</div>
    <div class="candidates">
      ${list.map((c) => `
        <div class="cand" data-q="${escapeHtml(c.question)}">
          <span class="sc">${Math.round(c.score * 100)}%</span>
          <span class="txt">${escapeHtml(c.question)}</span>
        </div>`).join('')}
    </div>`;
}

function render(data, rawText) {
  const best = data.best;

  if (!best) {
    el.result.innerHTML = data.partial
      ? `<div class="empty">继续输入…<br><span style="font-size:12px">这几个字还不够定位一道题，下面是题库里最接近的。</span></div>
         ${renderCandidates(data.candidates)}`
      : `<div class="empty">题库里没有匹配到这道题<br><span style="font-size:12px">可以试试：换个说法、少打几个字重查。</span></div>
         ${renderCandidates(data.candidates)}`;
    return;
  }

  const ans = String(best.answer || '').trim();
  const isChoice = /^[A-H]{1,6}$/.test(ans);
  const answerText = ans ? `答案：${ans}` : '题库中暂无答案';
  const longAnswer = !isChoice && ans.length > 14;

  const optionList = (best.options || []).length
    ? `<ul class="options">${best.options.map((o) => {
        const letter = (String(o).match(/^([A-H])/) || [])[1];
        const isCorrect = letter && ans && ans.toUpperCase().includes(letter);
        return `<li class="${isCorrect ? 'correct' : ''}">${escapeHtml(o)}</li>`;
      }).join('')}</ul>`
    : '';

  const tags = (best.tags || []).map((t) => `<span class="chip tag">${escapeHtml(t)}</span>`).join('');

  el.result.innerHTML = `
    <div class="answer-box">
      <div class="answer-label">标准答案</div>
      <div class="answer-value ${!ans ? 'none' : longAnswer ? 'long' : ''}">${escapeHtml(answerText)}</div>
    </div>
    <div class="meta-row">
      ${best.score != null ? scoreChip(best.score) : ''}
      <span class="chip">题库 ${BANK.length} 题</span>
      ${tags}
    </div>
    <div class="section-title">题干</div>
    <div class="question-text">${escapeHtml(best.question || rawText)}</div>
    ${optionList}
    ${best.analysis
      ? `<div class="section-title">解析</div><div class="analysis">${escapeHtml(best.analysis)}</div>`
      : '<div class="empty" style="padding:14px 0">这道题在题库里还没有解析</div>'}
    ${renderCandidates((data.candidates || []).filter((c) => c.id !== best.id))}`;
}

/* ------------------------------------------------------------------ *
 * 交互
 * ------------------------------------------------------------------ */

let seq = 0;
let autoTimer = null;
let lastAuto = '';

function solve(text) {
  text = (text || '').trim();
  if (!text) return setStatus('题目是空的', 'err');
  const my = ++seq;
  setStatus('正在题库中匹配…');
  // 匹配是同步的，但仍走一次微任务，让「匹配中」先刷出来
  setTimeout(() => {
    if (my !== seq) return;
    const data = search(text, 5);
    render(data, text);
    if (data.partial) setStatus(`只有 ${text.length} 个字，先给候选（多打几个字更准）`, 'ok');
    else if (data.best) setStatus(`匹配成功（相似度 ${(data.best.score * 100).toFixed(0)}%）`, 'ok');
    else setStatus('题库里没找到这道题', 'err');
  }, 0);
}

function scheduleAuto() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    const text = el.text.value.trim();
    if (text.length < 2 || text === lastAuto) return;
    lastAuto = text;
    solve(text);
  }, 600);
}

let composing = false;
el.text.addEventListener('compositionstart', () => { composing = true; });
el.text.addEventListener('compositionend', () => { composing = false; scheduleAuto(); });
el.text.addEventListener('input', () => {
  if (composing || el.text.isComposing) return;
  scheduleAuto();
});

el.result.addEventListener('click', (ev) => {
  const cand = ev.target.closest('.cand');
  if (!cand) return;
  const q = cand.dataset.q || '';
  el.text.value = q;
  lastAuto = q;
  solve(q);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$('#go').addEventListener('click', () => {
  clearTimeout(autoTimer);
  lastAuto = el.text.value.trim();
  solve(el.text.value);
});

$('#clear').addEventListener('click', () => {
  el.text.value = '';
  lastAuto = '';
  setStatus('');
  el.result.innerHTML = '<div class="empty">还没有结果<br><span style="font-size:12px">在上面输入题目，答案会出现在这里</span></div>';
  el.text.focus();
});

/* 启动 */
$('#bankCount').textContent = `题库 ${BANK.length} 题`;
if (!BANK.length) {
  el.result.innerHTML = '<div class="empty">题库没有加载进来<br><span style="font-size:12px">这是打包出错，重新生成一次即可</span></div>';
}
</script>
